<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互動磅秤 - 教學與測量遊戲</title>
<style>
  :root {
    --primary: #3498db;
    --success: #27ae60;
    --danger: #e74c3c;
    --dark: #2c3e50;
    --light: #f0f4f8;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: "Microsoft JhengHei", sans-serif;
    background-color: var(--light);
    margin: 0;
    padding: 20px;
    touch-action: pan-y; 
  }
  
  /* 上方控制列 */
  .header-controls {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .toggle-group {
    display: flex;
    background: #fff;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .toggle-btn {
    padding: 10px 20px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    background: transparent;
    cursor: pointer;
    color: #7f8c8d;
    transition: 0.3s;
  }
  .toggle-btn.active {
    background: var(--primary);
    color: white;
  }
  .mode-btn.active {
    background: #9b59b6;
    color: white;
  }

  /* 主要內容區 */
  .main-layout {
    display: flex;
    gap: 30px;
    align-items: flex-start;
    max-width: 1000px;
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* 物品庫 (遊戲模式) */
  .palette-container {
    display: none; 
    flex-direction: column;
    background: #fff;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    width: 260px;
  }
  .palette-container.show {
    display: flex;
  }
  
  /* 物品庫標題與更新按鈕 */
  .palette-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 2px dashed #ecf0f1;
  }
  .palette-title {
    text-align: left;
    font-weight: bold;
    color: var(--dark);
    font-size: 17px;
    margin: 0;
  }
  .refresh-btn {
    background: #eef2f5;
    border: 1px solid #bdc3c7;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    color: var(--dark);
    transition: 0.2s;
    white-space: nowrap;
  }
  .refresh-btn:hover {
    background: #d5e6f5;
    border-color: var(--primary);
    color: var(--primary);
  }

  .items-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }
  .draggable-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #f8f9fa;
    border: 2px dashed #bdc3c7;
    border-radius: 10px;
    padding: 10px;
    cursor: grab;
    user-select: none;
    touch-action: none; 
    transition: transform 0.1s;
  }
  .draggable-item:hover {
    background: #eaf2f8;
    border-color: var(--primary);
    transform: translateY(-2px);
  }
  .draggable-item:active {
    cursor: grabbing;
    transform: scale(0.95);
  }
  .item-emoji { font-size: 40px; pointer-events: none; }
  .item-name { font-size: 14px; color: #555; pointer-events: none; margin-top: 5px; font-weight: bold;}

  /* 拖曳時的幽靈元件 */
  .drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 1000;
    font-size: 50px;
    transform: translate(-50%, -50%);
    opacity: 0.9;
    filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3));
  }

  /* 磅秤主體區 */
  .scale-wrapper {
    background: #ffffff; 
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    text-align: center;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 80px; /* 為了容納上方的托盤與物品，預留空間 */
  }
  #scale-svg {
    cursor: grab;
    /* overflow: visible 允許我們在 svg 畫布外圍畫托盤 */
    overflow: visible; 
  }
  #scale-svg.game-mode {
    cursor: default; 
  }
  
  /* 秤盤區 (放置物品的隱形互動區，對齊上方黑色托盤) */
  .tray-area {
    position: absolute;
    /* 設定在此位置剛好懸浮於黑色托盤的上方 */
    top: -95px; 
    left: 50%;
    transform: translateX(-50%);
    width: 280px;
    height: 110px;
    border: 3px dashed transparent;
    border-radius: 10px;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 5px;
    transition: 0.3s;
  }
  .tray-area.highlight {
    background: rgba(52, 152, 219, 0.1);
    border-color: var(--primary);
  }
  .tray-item {
    font-size: 65px;
    cursor: pointer;
    animation: dropIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
  }
  .tray-item:hover::after {
    content: "✖ 移除";
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: white;
    background: #e74c3c;
    padding: 4px 10px;
    border-radius: 10px;
    white-space: nowrap;
    z-index: 20;
    font-weight: bold;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
  }
  @keyframes dropIn {
    0% { transform: translateY(-50px) scale(0.5); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* 教學模式操作區 */
  .teach-controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 20px;
  }
  #confirm-btn {
    padding: 12px 30px;
    font-size: 20px;
    font-weight: bold;
    color: white;
    background-color: var(--success);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
    transition: 0.2s;
  }
  #confirm-btn:disabled { background-color: #95a5a6; cursor: not-allowed; }
  
  #teach-answer-display {
    visibility: hidden; 
    opacity: 0;
    transition: opacity 0.5s;
    font-size: 32px;
    font-weight: bold;
    color: var(--dark);
    margin-top: 15px;
    padding: 10px 30px;
    background: #f8f9fa;
    border: 2px solid #bdc3c7;
    border-radius: 15px;
    text-align: center;
  }
  .underline-blue {
    text-decoration: underline;
    text-decoration-color: var(--primary);
    text-decoration-thickness: 4px;
    text-underline-offset: 6px;
  }

  /* 遊戲模式操作區 */
  .game-controls {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-top: 20px;
    background: #fff9c4;
    padding: 20px;
    border-radius: 15px;
    border: 2px solid #f1c40f;
    width: 100%;
    box-sizing: border-box;
  }
  .game-controls.show { display: flex; }
  
  .input-group {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
  }
  .input-group input {
    width: 120px;
    font-size: 24px;
    padding: 10px;
    text-align: center;
    border: 2px solid #bdc3c7;
    border-radius: 10px;
    outline: none;
  }
  .input-group input:focus { border-color: var(--primary); }
  .input-group span { font-size: 24px; font-weight: bold; color: var(--dark); }
  
  #submit-btn {
    padding: 12px 40px;
    font-size: 22px;
    font-weight: bold;
    color: white;
    background-color: var(--primary);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
  }
  #feedback-msg {
    margin-top: 15px;
    font-size: 22px;
    font-weight: bold;
    height: 30px;
  }
  
  .hint-text { color: #7f8c8d; font-size: 15px; font-weight: bold; margin-top: 10px;}

  /* 指針動畫 */
  #pointer-group { 
    transform-origin: 200px 200px; /* 修正：強制指定旋轉中心點在磅秤中央 */
    transition: transform 0.1s; 
  }
  #pointer-group.smooth { transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

</style>
</head>
<body>

<!-- 上方控制列 -->
<div class="header-controls">
  <div class="toggle-group">
    <button class="toggle-btn active" id="btn-1kg" onclick="switchScale(1000)">1公斤秤</button>
    <button class="toggle-btn" id="btn-3kg" onclick="switchScale(3000)">3公斤秤</button>
  </div>
  <div class="toggle-group">
    <button class="toggle-btn mode-btn active" id="btn-teach" onclick="switchMode('teach')">教學模式</button>
    <button class="toggle-btn mode-btn" id="btn-game" onclick="switchMode('game')">測量遊戲</button>
  </div>
</div>

<div class="main-layout">
  <!-- 物品庫 (遊戲模式顯示) -->
  <div class="palette-container" id="palette">
    <div class="palette-header">
      <div class="palette-title">請拖曳物品到秤上<br><small style="color:#7f8c8d;font-weight:normal;">(最多可放2個)</small></div>
      <button class="refresh-btn" onclick="renderPalette()">🔄 更新</button>
    </div>
    <div class="items-grid" id="items-grid">
      <!-- 物品會由 JS 動態生成 -->
    </div>
  </div>

  <!-- 磅秤主體 -->
  <div class="scale-wrapper">
    <!-- 秤盤區 (用於放置拖曳的物品) -->
    <div class="tray-area" id="tray">
      <!-- 放置的物品會出現在這 -->
    </div>

    <svg id="scale-svg" width="400" height="400" viewBox="0 0 400 400">
      
      <!-- 黑色托盤繪圖 (僅遊戲模式顯示) -->
      <g id="tray-graphic" display="none">
        <!-- 托盤平台 (變細) -->
        <rect x="60" y="-20" width="280" height="6" fill="#2c3e50" rx="3" />
        <!-- 支撐柱 (變細) -->
        <rect x="196" y="-14" width="8" height="24" fill="#2c3e50" />
      </g>

      <!-- 磅秤外框 -->
      <circle cx="200" cy="200" r="190" fill="#ffffff" stroke="#333" stroke-width="2" id="outer-ring"/>
      <circle cx="200" cy="200" r="186" fill="#ffffff" stroke="#ccc" stroke-width="1" id="inner-ring" display="none"/>
      
      <!-- 中央文字 -->
      <text x="200" y="145" text-anchor="middle" font-size="14px" fill="#333" font-weight="bold" id="center-text-max"></text>
      <text x="200" y="165" text-anchor="middle" font-size="14px" fill="#333" font-weight="bold" id="center-text-min"></text>

      <g id="ticks"></g>
      
      <!-- 指針 (移除舊的旋轉屬性，全權交給 CSS 處理) -->
      <g id="pointer-group" style="transform: rotate(0deg);">
        <polygon points="187,200 213,200 200,35" fill="#e74c3c" />
        <circle cx="200" cy="200" r="13" fill="#c0392b"/>
        <circle cx="200" cy="200" r="4" fill="#111"/>
      </g>
    </svg>
    
    <!-- 教學模式控制區 -->
    <div class="teach-controls" id="teach-ui">
      <button id="confirm-btn">確定 (開始讀秤)</button>
      <div class="hint-text">👆 教師請先用滑鼠拖曳指針出題</div>
      <div id="teach-answer-display">
        <div id="grams-text">0 公克</div>
        <div id="kg-text" style="color:#e74c3c; font-size: 22px; display:none;">0 公斤 0 公克</div>
      </div>
    </div>

    <!-- 遊戲模式控制區 -->
    <div class="game-controls" id="game-ui">
      <div class="input-group">
        <input type="number" id="answer-input" placeholder="輸入數字">
        <span>公克</span>
      </div>
      <button id="submit-btn" onclick="checkAnswer()">送出答案</button>
      <div id="feedback-msg"></div>
      <div class="hint-text">※ 點擊秤上的物品可以拿下來</div>
    </div>

  </div>
</div>

<script>
  // --- 狀態變數 ---
  let currentCapacity = 1000; 
  let currentMode = 'teach';  
  let currentWeight = 0;      
  let itemsOnScale = [];      
  
  // DOM 元素
  const scaleSvg = document.getElementById('scale-svg');
  const ticksGroup = document.getElementById('ticks');
  const pointerGroup = document.getElementById('pointer-group');
  const tray = document.getElementById('tray');
  const trayGraphic = document.getElementById('tray-graphic');
  const itemsGrid = document.getElementById('items-grid');
  let lastHighlightedLine = null;

  // 物品資料庫 (各12種，單位符合要求)
  const itemDB = {
    1000: [
      { name: "蘋果", emoji: "🍎", weight: 150 },
      { name: "香蕉", emoji: "🍌", weight: 180 },
      { name: "鉛筆盒", emoji: "👝", weight: 220 },
      { name: "保溫瓶", emoji: "🥤", weight: 350 },
      { name: "筆記本", emoji: "📘", weight: 120 },
      { name: "剪刀", emoji: "✂️", weight: 80 },
      { name: "橡皮擦", emoji: "🧼", weight: 30 },
      { name: "膠水", emoji: "🧴", weight: 50 },
      { name: "馬克杯", emoji: "☕", weight: 250 },
      { name: "橘子", emoji: "🍊", weight: 120 },
      { name: "玩具車", emoji: "🏎️", weight: 110 },
      { name: "飯糰", emoji: "🍙", weight: 140 }
    ],
    3000: [
      { name: "書包", emoji: "🎒", weight: 1200 },
      { name: "字典", emoji: "📓", weight: 800 },
      { name: "筆電", emoji: "💻", weight: 1500 },
      { name: "大南瓜", emoji: "🎃", weight: 1800 },
      { name: "西瓜", emoji: "🍉", weight: 2100 },
      { name: "籃球", emoji: "🏀", weight: 600 },
      { name: "盆栽", emoji: "🪴", weight: 1000 },
      { name: "貓咪", emoji: "🐈", weight: 2500 },
      { name: "啞鈴", emoji: "🏋️", weight: 2000 },
      { name: "檯燈", emoji: "💡", weight: 900 },
      { name: "安全帽", emoji: "🪖", weight: 1100 },
      { name: "溜冰鞋", emoji: "🛼", weight: 1600 }
    ]
  };

  // --- 初始化與繪製秤面 ---
  function renderScale(capacity) {
    ticksGroup.innerHTML = '';
    const cx = 200, cy = 200, radius = 180;
    
    document.getElementById('center-text-max').textContent = capacity === 3000 ? "最大計量 3kg" : "";
    document.getElementById('center-text-min').textContent = capacity === 3000 ? "最小刻度 10g" : "";
    document.getElementById('outer-ring').setAttribute('stroke-width', capacity === 3000 ? "3" : "2");
    document.getElementById('inner-ring').style.display = capacity === 3000 ? "block" : "none";

    for (let i = 0; i < capacity; i += 10) {
      let angle = (i / capacity) * 360 - 90;
      let radians = angle * (Math.PI / 180);
      
      let tickLength, strokeWidth, strokeColor = "#333";
      
      if (capacity === 1000) {
        let is50g = (i % 50 === 0);
        let isQuarter = (i % 250 === 0);
        tickLength = isQuarter ? 25 : (is50g ? 15 : 8);
        strokeWidth = isQuarter ? 3 : (is50g ? 2 : 1.5);
      } else {
        let is500g = (i % 500 === 0);
        let is100g = (i % 100 === 0);
        let is50g = (i % 50 === 0);
        tickLength = is500g ? 25 : (is100g ? 15 : (is50g ? 10 : 6));
        strokeWidth = is500g ? 2.5 : (is100g ? 1.5 : 1);
      }
      
      let x1 = cx + Math.cos(radians) * radius;
      let y1 = cy + Math.sin(radians) * radius;
      let x2 = cx + Math.cos(radians) * (radius - tickLength);
      let y2 = cy + Math.sin(radians) * (radius - tickLength);
      
      let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("id", "tick-" + i); 
      line.setAttribute("x1", x1);
      line.setAttribute("y1", y1);
      line.setAttribute("x2", x2);
      line.setAttribute("y2", y2);
      line.setAttribute("stroke", strokeColor);
      line.setAttribute("stroke-width", strokeWidth);
      line.dataset.origColor = strokeColor;
      line.dataset.origWidth = strokeWidth;
      ticksGroup.appendChild(line);

      let textNeeded = false;
      let textStr = "";
      let fontSize = "14px";
      let isBold = false;
      let isZero = (i === 0);

      if (capacity === 1000 && i % 50 === 0) {
        textNeeded = true;
        isBold = (i % 250 === 0);
        fontSize = isBold ? "24px" : "14px";
        textStr = i.toString();
      } else if (capacity === 3000 && (i === 0 || i === 500 || i === 1000 || i === 2000)) {
        textNeeded = true;
        fontSize = "22px";
        textStr = (i === 500) ? "500g" : (i / 1000) + "kg";
      }

      if (textNeeded) {
        let textRadius = (capacity === 1000 && isBold) ? radius - 45 : radius - 35;
        if(capacity === 3000) textRadius = radius - 45;
        
        let tx = cx + Math.cos(radians) * textRadius;
        let ty = cy + Math.sin(radians) * textRadius;
        
        let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("fill", "#2c3e50");
        text.setAttribute("font-family", "Arial, sans-serif");
        
        if (isZero) {
          text.setAttribute("x", cx);
          text.setAttribute("y", cy - textRadius + (capacity===3000?15:10));
          text.setAttribute("font-size", capacity===3000?"22px":"22px");
          text.setAttribute("font-weight", "bold");
          let unitStr = capacity === 3000 ? "3kg" : "1000g";
          text.innerHTML = `<tspan x="${cx}" dy="-10">0</tspan><tspan x="${cx}" dy="24" font-size="18px">${unitStr}</tspan>`;
        } else {
          text.setAttribute("x", tx);
          text.setAttribute("y", ty + 8); 
          text.setAttribute("font-size", fontSize);
          text.setAttribute("font-weight", isBold ? "bold" : "normal");
          text.textContent = textStr;
        }
        ticksGroup.appendChild(text);
      }
    }
  }

  // --- 切換秤與模式 ---
  function switchScale(capacity) {
    if(itemsOnScale.length > 0) {
      alert("請先將秤盤上的物品清空再切換秤面！");
      return;
    }
    currentCapacity = capacity;
    document.getElementById('btn-1kg').classList.toggle('active', capacity === 1000);
    document.getElementById('btn-3kg').classList.toggle('active', capacity === 3000);
    renderScale(capacity);
    resetState();
    if(currentMode === 'game') renderPalette();
  }

  function switchMode(mode) {
    currentMode = mode;
    document.getElementById('btn-teach').classList.toggle('active', mode === 'teach');
    document.getElementById('btn-game').classList.toggle('active', mode === 'game');
    
    document.getElementById('palette').classList.toggle('show', mode === 'game');
    document.getElementById('teach-ui').style.display = mode === 'teach' ? 'flex' : 'none';
    document.getElementById('game-ui').classList.toggle('show', mode === 'game');
    scaleSvg.classList.toggle('game-mode', mode === 'game');
    
    // 遊戲模式才顯示黑色托盤圖形
    trayGraphic.setAttribute('display', mode === 'game' ? 'block' : 'none');
    
    resetState();
    if (mode === 'game') renderPalette();
  }

  function resetState() {
    currentWeight = 0;
    itemsOnScale = [];
    tray.innerHTML = '';
    pointerGroup.style.transform = `rotate(0deg)`;
    clearHighlight();
    
    document.getElementById('teach-answer-display').style.opacity = '0';
    document.getElementById('teach-answer-display').style.visibility = 'hidden';
    document.getElementById('answer-input').value = '';
    document.getElementById('feedback-msg').textContent = '';
  }

  // --- 手動拖曳指針 (教學模式專用) ---
  let isDraggingPointer = false;
  let isAnimating = false;

  function calculateAngleAndWeight(x, y) {
    const rect = scaleSvg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let angleRad = Math.atan2(y - cy, x - cx);
    let angleDeg = angleRad * (180 / Math.PI) + 90;
    if (angleDeg < 0) angleDeg += 360;

    let weight = (angleDeg / 360) * currentCapacity;
    weight = Math.round(weight / 10) * 10; 
    if (weight === currentCapacity) weight = 0; 
    return { weight, angleDeg: (weight / currentCapacity) * 360 };
  }

  function updatePointerTeach(e) {
    if (currentMode !== 'teach' || !isDraggingPointer || isAnimating) return;
    e.preventDefault(); 
    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let clientY = e.touches ? e.touches[0].clientY : e.clientY;

    const { weight, angleDeg } = calculateAngleAndWeight(clientX, clientY);
    
    document.getElementById('teach-answer-display').style.opacity = '0';
    document.getElementById('teach-answer-display').style.visibility = 'hidden';
    clearHighlight();
    pointerGroup.classList.remove('smooth'); 
    
    currentWeight = (weight === 0 && angleDeg > 350) ? currentCapacity : weight;
    pointerGroup.style.transform = `rotate(${angleDeg}deg)`;
  }

  scaleSvg.addEventListener('pointerdown', (e) => { 
    if(currentMode === 'teach' && !isAnimating) {
      isDraggingPointer = true; 
      updatePointerTeach(e); 
      scaleSvg.setPointerCapture(e.pointerId);
    }
  });
  scaleSvg.addEventListener('pointermove', updatePointerTeach);
  scaleSvg.addEventListener('pointerup', () => { isDraggingPointer = false; });
  scaleSvg.addEventListener('pointercancel', () => { isDraggingPointer = false; });

  // --- 教學模式：唱數動畫 ---
  const synth = window.speechSynthesis;
  function speakNumber(num) {
    if (synth.speaking) synth.cancel(); 
    let utterance = new SpeechSynthesisUtterance(num.toString());
    utterance.lang = 'zh-TW';
    utterance.rate = 1.2; 
    synth.speak(utterance);
  }

  function clearHighlight() {
    if (lastHighlightedLine) {
      lastHighlightedLine.setAttribute("stroke", lastHighlightedLine.dataset.origColor);
      lastHighlightedLine.setAttribute("stroke-width", lastHighlightedLine.dataset.origWidth);
      lastHighlightedLine = null;
    }
  }

  function highlightTick(weight) {
    clearHighlight(); 
    let targetId = (weight === currentCapacity) ? 0 : weight;
    let line = document.getElementById("tick-" + targetId);
    if (line) {
      line.setAttribute("stroke", "#3498db"); 
      lastHighlightedLine = line; 
    }
  }

  const delay = ms => new Promise(res => setTimeout(res, ms));

  document.getElementById('confirm-btn').addEventListener('click', async () => {
    if (isAnimating) return;
    if (currentWeight === 0) { showFinalAnswerTeach(); return; }

    isAnimating = true;
    document.getElementById('confirm-btn').disabled = true; 
    
    let target = currentWeight;
    let bigStepSize = currentCapacity === 1000 ? 50 : 100; 
    let bigSteps = Math.floor(target / bigStepSize);  
    let smallSteps = (target % bigStepSize) / 10;           
    
    for (let i = 1; i <= bigSteps; i++) {
        let w = i * bigStepSize;
        highlightTick(w);
        speakNumber(w);
        await delay(currentCapacity === 1000 ? 700 : 800); 
    }
    
    for (let i = 1; i <= smallSteps; i++) {
        let w = bigSteps * bigStepSize + i * 10;
        highlightTick(w);
        speakNumber(w);
        await delay(currentCapacity === 1000 ? 700 : 1400); 
    }
    
    clearHighlight();
    showFinalAnswerTeach();
    isAnimating = false;
    document.getElementById('confirm-btn').disabled = false;
  });

  function showFinalAnswerTeach() {
    const gramsText = document.getElementById('grams-text');
    const kgText = document.getElementById('kg-text');
    const displayDiv = document.getElementById('teach-answer-display');

    if (currentWeight >= 1000 && currentWeight !== 3000) {
      let weightStr = currentWeight.toString();
      let kgPart = weightStr.slice(0, -3);
      let gPart = weightStr.slice(-3);
      gramsText.innerHTML = `${kgPart}<span class="underline-blue">${gPart}</span> 公克`;
      let kg = Math.floor(currentWeight / 1000);
      let g = currentWeight % 1000;
      kgText.style.display = "block";
      kgText.textContent = `${kg} 公斤 ${g} 公克`;
    } else if(currentWeight === 1000 && currentCapacity === 1000) {
      gramsText.innerHTML = `1<span class="underline-blue">000</span> 公克`;
      kgText.style.display = "block";
      kgText.textContent = `1 公斤 0 公克`;
    } else if(currentWeight === 3000) {
      gramsText.innerHTML = `3<span class="underline-blue">000</span> 公克`;
      kgText.style.display = "block";
      kgText.textContent = `3 公斤 0 公克`;
    } else {
      gramsText.innerHTML = `${currentWeight} 公克`;
      kgText.style.display = "none";
    }
    
    displayDiv.style.visibility = 'visible';
    displayDiv.style.opacity = '1';
    let finalSpeakText = kgText.style.display === "block" ? kgText.textContent : gramsText.textContent;
    speakNumber(finalSpeakText); 
  }

  // --- 遊戲模式：隨機物品與拖曳答題 ---
  function renderPalette() {
    itemsGrid.innerHTML = '';
    
    // 將物品陣列打亂，並選取前 6 個展示
    const items = itemDB[currentCapacity];
    const shuffledItems = [...items].sort(() => 0.5 - Math.random());
    const displayItems = shuffledItems.slice(0, 6);
    
    displayItems.forEach(item => {
      let div = document.createElement('div');
      div.className = 'draggable-item';
      div.innerHTML = `<div class="item-emoji">${item.emoji}</div><div class="item-name">${item.name}</div>`;
      
      div.addEventListener('pointerdown', (e) => startDrag(e, item));
      itemsGrid.appendChild(div);
    });
  }

  let draggingGhost = null;
  let draggingItemData = null;

  function startDrag(e, itemData) {
    if (itemsOnScale.length >= 2) {
      alert("秤上最多只能放 2 個物品喔！");
      return;
    }
    e.preventDefault();
    draggingItemData = itemData;
    
    draggingGhost = document.createElement('div');
    draggingGhost.className = 'drag-ghost';
    draggingGhost.textContent = itemData.emoji;
    document.body.appendChild(draggingGhost);
    
    moveGhost(e.clientX, e.clientY);
    
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', onDragEnd);
  }

  function moveGhost(x, y) {
    if(draggingGhost) {
      draggingGhost.style.left = x + 'px';
      draggingGhost.style.top = y + 'px';
    }
  }

  function onDragMove(e) {
    moveGhost(e.clientX, e.clientY);
    
    let trayRect = tray.getBoundingClientRect();
    if (e.clientX > trayRect.left && e.clientX < trayRect.right && 
        e.clientY > trayRect.top && e.clientY < trayRect.bottom) {
      tray.classList.add('highlight');
    } else {
      tray.classList.remove('highlight');
    }
  }

  function onDragEnd(e) {
    document.removeEventListener('pointermove', onDragMove);
    document.removeEventListener('pointerup', onDragEnd);
    tray.classList.remove('highlight');
    
    if (draggingGhost) {
      let trayRect = tray.getBoundingClientRect();
      
      if (e.clientX > trayRect.left && e.clientX < trayRect.right && 
          e.clientY > trayRect.top && e.clientY < trayRect.bottom) {
        
        itemsOnScale.push(draggingItemData);
        updateGameScale();
        
        document.getElementById('feedback-msg').textContent = ''; 
        document.getElementById('answer-input').value = '';
      }
      
      draggingGhost.remove();
      draggingGhost = null;
      draggingItemData = null;
    }
  }

  function updateGameScale() {
    tray.innerHTML = '';
    let totalWeight = 0;
    
    itemsOnScale.forEach((item, index) => {
      totalWeight += item.weight;
      let span = document.createElement('span');
      span.className = 'tray-item';
      span.textContent = item.emoji;
      span.title = "點擊移除";
      span.onclick = () => removeTrayItem(index);
      tray.appendChild(span);
    });
    
    currentWeight = totalWeight;
    
    let angleDeg = (currentWeight / currentCapacity) * 360;
    pointerGroup.classList.add('smooth');
    pointerGroup.style.transform = `rotate(${angleDeg}deg)`;
  }

  function removeTrayItem(index) {
    itemsOnScale.splice(index, 1);
    updateGameScale();
    document.getElementById('feedback-msg').textContent = ''; 
  }

  function checkAnswer() {
    const inputVal = parseInt(document.getElementById('answer-input').value);
    const msgDiv = document.getElementById('feedback-msg');
    
    if (isNaN(inputVal)) {
      msgDiv.style.color = 'var(--dark)';
      msgDiv.textContent = '請輸入數字！';
      return;
    }
    
    if (inputVal === currentWeight) {
      msgDiv.style.color = 'var(--success)';
      msgDiv.textContent = '🎉 答對了！好厲害！';
      let utterance = new SpeechSynthesisUtterance("答對了");
      utterance.lang = 'zh-TW';
      window.speechSynthesis.speak(utterance);
    } else {
      msgDiv.style.color = 'var(--danger)';
      msgDiv.textContent = '❌ 答錯了，請再看一次刻度喔！';
      let utterance = new SpeechSynthesisUtterance("再試一次");
      utterance.lang = 'zh-TW';
      window.speechSynthesis.speak(utterance);
    }
  }

  // 初始執行
  renderScale(1000);
</script>
