<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學遊戲入口網</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background-color: #f0f8ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .game-card {
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 200px;
            transition: transform 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            color: #3498db;
        }
    </style>
</head>
<body>

    <h1>🎮 數學教學資源庫</h1>

    <div class="index.html">
        <a href="#" class="game-card">
            <div class="icon">🔍</div>
            <div class="title">原本的教材</div>
            <p>點擊查看現有練習</p>
        </a>

        <a href="game.html" class="game-card">
            <div class="icon">🎲</div>
            <div class="title">新數學遊戲</div>
            <p>點擊開始闖關</p>
        </a>
    </div>

</body>
</html>
