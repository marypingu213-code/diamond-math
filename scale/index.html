<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學教學資源大廳</title>
    <style>
        /* 整體背景與字體設定 */
        body {
            font-family: 'Microsoft JhengHei', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f7fa 0%, #80deea 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        /* 標題樣式 */
        h1 {
            font-size: 2.5rem;
            color: #006064;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        /* 按鈕容器 */
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 800px;
        }

        /* 遊戲卡片樣式 */
        .game-card {
            background-color: #ffffff;
            width: 250px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        /* 滑鼠移上去的效果 */
        .game-card:hover {
            transform: translateY(-10px);
            border-color: #00bcd4;
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
        }

        /* 圖示大小 */
        .icon {
            font-size: 60px;
            margin-bottom: 15px;
            display: block;
        }

        /* 卡片標題 */
        .title {
            font-size: 22px;
            font-weight: bold;
            color: #00838f;
            margin-bottom: 10px;
        }

        /* 卡片描述 */
        .desc {
            font-size: 16px;
            color: #666;
            line-height: 1.5;
        }

        /* 頁尾小字 */
        footer {
            margin-top: 50px;
            font-size: 14px;
            color: #006064;
        }
    </style>
</head>
<body>

    <h1>🎮 數學互動學習大廳</h1>

    <div class="container">
        
        <a href="original.html" class="game-card">
            <span class="icon">📘</span>
            <div class="title">一公斤秤</div>
            <div class="desc">你會了嗎?。</div>
        </a>

        <a href="game.html" class="game-card">
            <span class="icon">🚀</span>
            <div class="title">三公斤秤</div>
            <div class="desc">邊玩邊學數學！</div>
        </a>

    </div>

    <footer>
        <p>© 2026 數學教學資源庫 - 讓學習變有趣</p>
    </footer>

</body>
</html>
