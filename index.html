<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond 老師的數學大廳</title>
    <style>
        body { 
            font-family: "jf-open-huninn", "Microsoft JhengHei", sans-serif; 
            margin: 0;
            padding: 3vh 3vw; 
            background-color: #fce4ec; /* 數學區換個粉嫩的底色區隔 */
            color: #444;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header-container {
            background-color: #ffffff;
            border: 4px dashed #f06292;
            border-radius: 30px;
            padding: 20px 60px;
            margin-bottom: 40px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            text-align: center;
        }

        h1 { 
            color: #d81b60; 
            font-size: clamp(30px, 4vw, 50px); 
            margin: 0;
            letter-spacing: 2px;
        }

        .grid { 
            display: flex; 
            flex-wrap: wrap;
            justify-content: center; 
            gap: 30px; 
            width: 100%;
            max-width: 1200px; 
        }

        .card { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px; 
            border-radius: 30px; 
            text-decoration: none; 
            background-color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
            border: 5px solid transparent;
            width: 280px; 
            box-sizing: border-box;
        }

        .card:hover { 
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(216, 27, 96, 0.15);
            border-color: #f8bbd0;
        }

        .icon { font-size: 80px; margin-bottom: 15px; }
        .card h3 { margin: 0 0 10px 0; font-size: 28px; color: #ad1457; }
        .card p { font-size: 18px; color: #888; margin: 0; font-weight: bold; }

        .back-btn {
            margin-top: 50px;
            padding: 10px 25px;
            background-color: #ad1457;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }
        .back-btn:hover { background-color: #880e4f; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>🔢 Diamond 老師的數學挑戰區 🔢</h1>
    </div>
    
    <div class="grid">
        <a href="./point/index.html" class="card">
            <div class="icon">🍎</div>
            <h3>認識小數</h3>
            <p>基礎觀念練習</p>
        </a>

        </div>

    <a href="https://marypingu213-code.github.io/G3-diamond/" class="back-btn">⬅ 回到主遊戲大廳</a>

</body>
</html>
